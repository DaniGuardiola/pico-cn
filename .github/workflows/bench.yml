name: Bench

# Non-gating: benchmarks on shared CI runners are directional, not decisive.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: pr size + performance report
        run: pnpm run report
      - name: real-repository corpus
        if: github.event_name != 'pull_request'
        run: node packages/conformance/bench/corpus.mjs
